services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    restart: always

  php:
    image: php:8.2-fpm
    volumes:
      - ./app:/var/www/html
    depends_on:
      - mysql
    restart: always
    command: >
      sh -c "docker-php-ext-install mysqli && php-fpm"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: devops_db
      MYSQL_USER: devopsuser
      MYSQL_PASSWORD: devopspass123
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
